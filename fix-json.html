<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Исправить JSON — Посмотрим</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 300px;
            background-color: #2d0a0a;
            color: white;
            border: 2px solid #8b0000;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            margin: 10px 0;
        }
        button {
            background-color: #8b0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background-color: #ff0000;
        }
        .success {
            color: #00ff00;
            margin: 10px 0;
        }
        .error {
            color: #ff0000;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Исправить JSON</h1>
    <p>Вставьте JSON из localStorage в поле ниже и нажмите "Исправить JSON"</p>
    
    <textarea id="input-json" placeholder="Вставьте JSON сюда"></textarea>
    <button onclick="fixJSON()">Исправить JSON</button>
    
    <div id="result"></div>
    
    <textarea id="output-json" readonly placeholder="Исправленный JSON появится здесь"></textarea>
    <button onclick="copyToClipboard()">Скопировать</button>
    
    <script>
        function fixJSON() {
            const input = document.getElementById('input-json').value;
            const resultDiv = document.getElementById('result');
            const output = document.getElementById('output-json');
            
            try {
                // Экранируем кавычки внутри строковых значений
                let fixed = input;
                
                // Заменяем кавычки внутри значений на экранированные
                // Это регулярное выражение находит кавычки внутри строковых значений
                fixed = fixed.replace(/"([^"]*)"([^"]*)"([^"]*)"/g, function(match, p1, p2, p3) {
                    // Если это не конец строки, экранируем внутренние кавычки
                    if (p2) {
                        return `"${p1}\\"${p2}\\"${p3}"`;
                    }
                    return match;
                });
                
                // Более простой подход: заменяем все " внутри значений на \"
                // Сначала находим все пары ключ-значение
                fixed = fixed.replace(/:"([^"]*)"/g, function(match, value) {
                    // Экранируем кавычки внутри значения
                    const escapedValue = value.replace(/"/g, '\\"');
                    return `:"${escapedValue}"`;
                });
                
                output.value = fixed;
                resultDiv.innerHTML = '<p class="success">Кавычки экранированы!</p>';
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Ошибка: ${error.message}</p>`;
                output.value = '';
            }
        }
        
        function copyToClipboard() {
            const output = document.getElementById('output-json');
            output.select();
            document.execCommand('copy');
            alert('Скопировано!');
        }
    </script>
</body>
</html>
