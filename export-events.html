<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспорт событий — Посмотрим</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 400px;
            background-color: #2d0a0a;
            color: white;
            border: 2px solid #8b0000;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
        }
        button {
            background-color: #8b0000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background-color: #ff0000;
        }
    </style>
</head>
<body>
    <h1>Экспорт событий из localStorage</h1>
    <button onclick="exportEvents()">Экспортировать события</button>
    <textarea id="json-output" readonly placeholder="Нажмите кнопку для экспорта"></textarea>
    <p>Скопируйте этот JSON и вставьте в файл events.json</p>

    <script>
        function exportEvents() {
            const savedEvents = localStorage.getItem('events');
            if (savedEvents) {
                document.getElementById('json-output').value = savedEvents;
            } else {
                document.getElementById('json-output').value = '[]';
                alert('В localStorage нет событий');
            }
        }
    </script>
</body>
</html>
